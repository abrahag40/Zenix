name: CI

on:
  # 🔴 Sin `branches`, a propósito: el CI corre en TODO pull request, apunte a
  # donde apunte.
  #
  # Con `branches: [main]` un PR apilado sobre otra rama NO se verificaba NUNCA
  # —medido el 2026-09-23: los PR #145, #146 y #147 llegaron a estar listos para
  # fusionar sin una sola corrida de «Lint & Test»—. Y reapuntarlos a main
  # tampoco lo dispara, porque el evento es `edited` y no está en los tipos por
  # defecto. Es decir: apilar PRs equivalía a saltarse el CI en silencio.
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: housekeeping_test
          POSTGRES_USER: housekeeping
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # El CLAUDE.md se carga ENTERO al inicio de cada sesión, y la documentación
      # oficial de Claude Code es literal: «target under 200 lines per CLAUDE.md
      # file. Longer files consume more context and REDUCE ADHERENCE».
      #
      # Por qué hace falta un gate: este archivo llegó a 2292 líneas — 11,5× el
      # objetivo. No pasó de golpe: creció una línea a la vez, y cada línea añadida
      # parecía razonable. Al final los cuatro principios no negociables competían
      # por atención con bitácoras de sprints cerrados hacía cuatro meses.
      #
      # El trinquete no obliga a arreglar nada: impide que crezca.
      #
      # La versión completa —que mide además MEMORY.md, los SKILL.md y las reglas
      # sin «paths:»— vive en el plugin zahardev-metodo. Aquí va la comprobación
      # autosuficiente, porque el plugin no está en el runner.
      - name: Presupuesto de contexto (CLAUDE.md ≤ 200 líneas)
        run: |
          n=$(wc -l < CLAUDE.md | tr -d ' ')
          echo "CLAUDE.md: $n/200 líneas"
          if [ "$n" -gt 200 ]; then
            echo "::error file=CLAUDE.md::Tiene $n líneas y el objetivo son 200. Mueve el relato a docs/ y las reglas por carpeta a .claude/rules/ con «paths:». Ojo: los imports con @ruta NO ahorran nada, también cargan al inicio."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Pin npm 11 — el lockfile (lockfileVersion 3) lo genera el dev environment
      # con npm 11; Node 20 ships con npm 10 cuyo `ci` es estricto con campos que
      # npm 11 añade. Sin este pin, npm 10 reporta entries faltantes que en
      # realidad están presentes en formato nuevo.
      - name: Pin npm to 11.x
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      # Workspace renombrado @housekeeping/api → @zenix/api (legacy en main).
      - name: Generate Prisma client
        run: npm run db:generate --workspace=@zenix/api
        env:
          DATABASE_URL: postgresql://housekeeping:testpassword@localhost:5432/housekeeping_test

      - name: Run migrations
        run: npm run db:migrate:deploy --workspace=@zenix/api
        env:
          DATABASE_URL: postgresql://housekeeping:testpassword@localhost:5432/housekeeping_test

      # Seed BD para tests de integración. 3 scripts encadenados —
      # specs explícitamente declaran sus pre-requisites:
      #   - seed.ts:                 seed-org-1, properties, rooms, users
      #   - seed-nova-foundation.ts: nova-foundation.spec.ts + rbac-integration
      #   - seed-channex-rate-plans: channex-crud-schema.spec.ts (5 mappings)
      # Sin estos los e2e fallan con findFirstOrThrow / PrismaClientKnownRequestError.
      - name: Seed test database (base + nova + channex sandbox)
        run: |
          cd apps/api
          npx ts-node -r tsconfig-paths/register prisma/seed.ts
          npx ts-node -r tsconfig-paths/register prisma/scripts/seed-nova-foundation.ts
          npx ts-node -r tsconfig-paths/register prisma/scripts/seed-channex-rate-plans.ts
        env:
          DATABASE_URL: postgresql://housekeeping:testpassword@localhost:5432/housekeeping_test

      # CI-RESCUE residual cerrado 2026-06-06:
      #   · Lint: ✅ blocking (desde 2026-05-15).
      #   · Test: ✅ BLOCKING. Última deuda residual cerrada:
      #     - channex-crud.gateway.spec: `jest.spyOn(global, 'fetch')` →
      #       asignación directa en globalThis (Node 16 no expone fetch)
      #     - subscription.service: bare `crypto.randomUUID()` → import
      #       explícito de 'node:crypto' (Node 16 sin global crypto)
      #     - jest.setup.js polyfill `globalThis.crypto = webcrypto` para
      #       que @nestjs/schedule (SchedulerOrchestrator.addCron) funcione
      #       en Node 16 jest env — afectaba tenant-isolation y todo test
      #       que importara módulos con cron decorators.
      #     - --runInBand evita resource contention DB en CI single-node
      #       (channex-management.spec falla intermitente en paralelo).
      - name: Lint
        run: npx turbo lint

      # ── 🔴 EL HUECO QUE COSTÓ DOS DESPLIEGUES EN UN DÍA ────────────────────
      #
      # El 2026-09-24 llegaron a `main` dos cambios que rompían el ARRANQUE de
      # la API. Los dos pasaron este CI entero en verde:
      #
      #   · `nada?: never` en un DTO → Swagger no sabe convertirlo en esquema y
      #     lanzaba «A circular dependency has been detected» al construir el
      #     documento OpenAPI. Render marcó el deploy en rojo y siguió sirviendo
      #     la versión anterior: la funcionalidad simplemente nunca llegó.
      #
      # Y este CI no podía verlo por una razón concreta: **no construía la
      # aplicación y no la arrancaba nunca**. `lint` mira el estilo, `test`
      # instancia servicios con dobles, y `test:e2e` abre dos conexiones a la
      # base — ninguno ejecuta `nest build` ni `main.ts`.
      #
      # Compilar, pasar pruebas y arrancar son TRES cosas distintas, y hasta hoy
      # sólo se comprobaban dos. Este paso hace la tercera: construye como
      # construye Render y arranca como arranca Render.
      #
      # Es BLOQUEANTE a propósito. Un fallo de arranque no degrada nada: deja el
      # servicio entero fuera, o —peor, porque no se nota— deja en producción
      # una versión vieja mientras todos creen que se desplegó lo nuevo.
      - name: Build (lo que el CI no hacía)
        run: npx turbo build --filter=@zenix/api
        env:
          DATABASE_URL: postgresql://housekeeping:testpassword@localhost:5432/housekeeping_test

      - name: Arranque real — la app tiene que levantar y responder
        run: |
          set -euo pipefail
          # Se arranca EXACTAMENTE como en producción: el mismo script que
          # Render ejecuta. Arrancarlo de otra forma probaría otra cosa.
          npm run start:prod --workspace=@zenix/api > /tmp/arranque.log 2>&1 &
          pid=$!

          # Hasta 90 s. La app levanta en ~2 s, pero un runner cargado tarda
          # más y un timeout justo produce rojos intermitentes — que es la
          # forma más rápida de que alguien acabe borrando el paso.
          ok=0
          for i in $(seq 1 90); do
            # Si el proceso ya murió, no hay que esperar los 90 s: se falla ya
            # y se enseña el log, que es donde está el motivo.
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::La API murió durante el arranque."
              tail -40 /tmp/arranque.log
              exit 1
            fi
            # Un 404 también significa «está viva y enrutando»: lo que se
            # comprueba es que RESPONDA, no que encuentre la propiedad. Sólo
            # `000` —el código que curl inventa cuando no hubo respuesta—
            # significa que todavía no está.
            #
            # 🔴 Sin `|| true` y con `|| echo 000`, curl imprime su `000` Y el
            # echo añade otro: sale `000000`, que no es `000`, y el bucle da
            # por arrancada una app que no lo está. Me pasó escribiendo esto.
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${PORT}/api/v1/public/properties/no-existe") || true
            if [ "$code" != "000" ] && [ -n "$code" ]; then ok=1; echo "responde en ${i}s (http=$code)"; break; fi
            sleep 1
          done

          if [ "$ok" != "1" ]; then
            echo "::error::La API no respondió en 90 s."
            tail -40 /tmp/arranque.log
            kill "$pid" 2>/dev/null || true
            exit 1
          fi

          # 🔴 Y el documento OpenAPI, que es lo que reventó. Servirlo obliga a
          # recorrer TODOS los DTO del proyecto: es la comprobación que habría
          # cazado el `never` sin que nadie supiera que había que buscarlo.
          if ! curl -fsS "http://localhost:${PORT}/api/docs-json" -o /tmp/openapi.json; then
            echo "::error::La app arrancó pero no sirve el documento OpenAPI."
            tail -40 /tmp/arranque.log
            kill "$pid" 2>/dev/null || true
            exit 1
          fi
          rutas=$(node -e "console.log(Object.keys(require('/tmp/openapi.json').paths).length)")
          echo "✓ arrancó, responde y documenta $rutas rutas"
          # El documento está acotado a PublicBookingModule a propósito
          # (`include:` en main.ts): es la API pública del motor, no el PMS
          # entero. Hoy son 9 rutas — medido arrancando la app en local.
          #
          # El mínimo es 5 y no 9: exigir el número exacto convertiría este
          # paso en un test de regresión de la superficie pública, que se
          # pondría rojo cada vez que alguien añada una ruta legítima. Lo que
          # aquí se vigila es que el documento NO esté vacío, porque vacío
          # significaría que el explorador se rindió sin construir nada y el
          # paso pasaría sin haber probado lo que dice probar.
          if [ "$rutas" -lt 5 ]; then
            echo "::error::Sólo $rutas rutas en el OpenAPI. El documento no se construyó."
            exit 1
          fi

          kill "$pid" 2>/dev/null || true
        env:
          PORT: '3001'
          DATABASE_URL: postgresql://housekeeping:testpassword@localhost:5432/housekeeping_test
          JWT_SECRET: test-secret-not-for-production
          JWT_EXPIRES_IN: 1h
          NODE_ENV: production

      # --testPathIgnorePatterns excluye 2 specs Channex que requieren
      # Channex sandbox infrastructure (UUIDs en env vars + sandbox property
      # con room types Twin/Double + 5 rate plans pre-creados). Análogos a
      # cert Tests 2-8 (§148) ya marcados `describe.skip`. Corren en local
      # cuando dev tiene .env con CHANNEX_SANDBOX_* configurado. Quedarán
      # cubiertos cuando se ejecute Channex Stage 4 walkthrough (§148):
      #   - channex-crud-schema.spec.ts
      #   - channex-management/channex-management.spec.ts
      # 🔴 El e2e de sobreventa. La auditoría del 2026-09-22 midió que en los 105
      # specs el advisory lock está SIEMPRE mockeado y que no existía un solo
      # archivo e2e: borrar la línea del lock dejaba 1316 pruebas en verde.
      #
      # Un lock no se puede probar con un cliente mockeado, porque lo que se prueba
      # es que DOS transacciones distintas se excluyen. Hacen falta dos conexiones.
      #
      # Es BLOQUEANTE a propósito: el caso que cubre —la web y el mostrador
      # vendiendo la misma cama— es el único fallo de este sistema que se cobra en
      # un huésped de pie en la recepción, y no se puede deshacer.
      - name: Test e2e — sobreventa (dos conexiones reales)
        run: npx turbo test:e2e --filter=@zenix/api
        env:
          # 🔴 Literal, como los demás pasos. Estuvo como `${{ env.DATABASE_URL }}`
          # y eso NO existe a nivel de job —cada paso define el suyo—, así que
          # resolvía a cadena vacía, la suite se saltaba sola y el paso salía en
          # VERDE habiendo probado cero. Medido: «Tests: 5 skipped, 5 total».
          DATABASE_URL: postgresql://housekeeping:testpassword@localhost:5432/housekeeping_test
          JWT_SECRET: test-secret-not-for-production
          JWT_EXPIRES_IN: 1h
          NODE_ENV: test
          CI: 'true'

      - name: Test
        run: npx turbo test -- --runInBand --testPathIgnorePatterns="channex-crud-schema" --testPathIgnorePatterns="channex-management/channex-management"
        env:
          DATABASE_URL: postgresql://housekeeping:testpassword@localhost:5432/housekeeping_test
          JWT_SECRET: test-secret-not-for-production
          JWT_EXPIRES_IN: 1h
          NODE_ENV: test
